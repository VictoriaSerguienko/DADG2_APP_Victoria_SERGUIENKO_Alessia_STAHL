<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-home.css">
</head>
<body>
    <div class="header">
        <img src="./LINKZ/LOGO/LOGO.svg" alt="">
    </div>
    
    <div class="navigation">
        <img src="./LINKZ/ICONES/filters.svg" alt="" height="40px">
        <div class="options">
            <a href="">In my field</a>
            <a href="">Nearby</a>
            <a href="">See all</a>
        </div>
    </div>
    <div class="profil">
        <div class="subheader">
            <img src="./LINKZ/ICONES/refresh.svg" alt="">
            <div class="nametag">
                <h2>Josephine Marchand</h2>
            </div>
            <div id="fakecontent"></div>
        </div>
        <div class="swipeoptions">
            <img src="./LINKZ/ICONES/dislike.svg" alt="">
            <img src="./LINKZ/ICONES/like.svg" alt="">
        </div>
    
        <div class="cardinfo">
            <div class="info">
                <div class="titlecardfull">
                    <div class="titlecardpicto">
                        <div class="titlecard">
                            <h1>Ingé.son</h1>
                            <div class="age">
                                <p>22 ans</p>
                            </div>
                        </div>
                        <img src="./LINKZ/ICONES/save.svg" alt="">
                    </div>
                    <p>Studio Sillage · Nice</p>
                </div>
                <div class="apropos">
                    <h2>À propos</h2>
                    <p>Je travaille en studio sur l’enregistrement et le mixage de projets musicaux. Je m’occupe aussi de la prise de son pour des sessions live...</p>
                </div>
            </div>
            <p>Swipe up</p>
        </div>
    </div>

    <div class="tabbar">
        <div class="tabbarbutton">
            <img src="./LINKZ/ICONES/home.svg" alt="">
            <p>Home</p>
        </div>
        <div class="tabbarbutton">
            <img src="./LINKZ/ICONES/explore.svg" alt="">
            <p>Explore</p>
        </div>
        <div class="tabbarbutton">
            <img src="./LINKZ/ICONES/like.svg" alt="">
            <p>Network</p>
        </div>
        <div class="tabbarbutton">
            <img src="./LINKZ/ICONES/profile.svg" alt="">
            <p>Profile</p>
        </div>
    </div>
</body>
</html>
